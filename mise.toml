[tools]
node = "26.9.0"

[tasks.dev]
description = "Start local dev server"
run = "node src/dev.ts"

[tasks.build]
description = "Build the site"
run = "node src/build.ts"

[tasks.check]
description = "Run checks"
run = "node src/check.ts"

[tasks.preview]
description = "Serve the built site without rebuilding"
run = "node src/dev.ts --serve-only"

[tasks.new-post]
description = "Create a branch, scaffold a post, open it in VS Code, and start the dev server"
usage = "arg \"<title>\""
run = '''
#!/usr/bin/env bash
set -euo pipefail
git checkout -b "$usage_title"
./scripts/generate-post.sh "$usage_title"
code "./posts/$usage_title.md"
open "http://localhost:3000/blog/$usage_title"
node src/dev.ts
'''
